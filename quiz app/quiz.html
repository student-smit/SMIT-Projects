<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Page</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-200 via-rose-300 to-amber-100 flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-2xl bg-white/60 backdrop-blur-lg border border-white/50 rounded-[2.5rem] shadow-2xl p-8 sm:p-10">

    <h2 id="quest" class="text-2xl sm:text-3xl font-extrabold text-rose-800 mb-8 leading-tight">
      Question text here...
    </h2>

    <div class="space-y-4">

      <label class="flex items-center gap-4 p-5 border-2 border-white/50 bg-white/40 rounded-2xl cursor-pointer hover:bg-rose-50 hover:border-rose-300 transition-all duration-300 group shadow-sm">
        <input type="radio" name="option" id="radioA" value="A" class="w-6 h-6 text-rose-500 focus:ring-rose-400 border-gray-300">
        <span id="labelA" class="text-rose-900 font-semibold text-lg"></span>
      </label>

      <label class="flex items-center gap-4 p-5 border-2 border-white/50 bg-white/40 rounded-2xl cursor-pointer hover:bg-rose-50 hover:border-rose-300 transition-all duration-300 group shadow-sm">
        <input type="radio" name="option" id="radioB" value="B" class="w-6 h-6 text-rose-500 focus:ring-rose-400 border-gray-300">
        <span id="labelB" class="text-rose-900 font-semibold text-lg"></span>
      </label>

      <label class="flex items-center gap-4 p-5 border-2 border-white/50 bg-white/40 rounded-2xl cursor-pointer hover:bg-rose-50 hover:border-rose-300 transition-all duration-300 group shadow-sm">
        <input type="radio" name="option" id="radioC" value="C" class="w-6 h-6 text-rose-500 focus:ring-rose-400 border-gray-300">
        <span id="labelC" class="text-rose-900 font-semibold text-lg"></span>
      </label>

      <label class="flex items-center gap-4 p-5 border-2 border-white/50 bg-white/40 rounded-2xl cursor-pointer hover:bg-rose-50 hover:border-rose-300 transition-all duration-300 group shadow-sm">
        <input type="radio" name="option" id="radioD" value="D" class="w-6 h-6 text-rose-500 focus:ring-rose-400 border-gray-300">
        <span id="labelD" class="text-rose-900 font-semibold text-lg"></span>
      </label>

    </div>

    <div class="mt-10 text-center">
      <button id="nextBtn"
        class="w-full sm:w-auto bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold px-12 py-4 rounded-2xl shadow-xl transition transform hover:scale-105 active:scale-95 tracking-wide">
        Next Question →
      </button>
    </div>

  </div>

<script src="app.js" type="module"></script>
</body>
</html>
